server:
  port: ${PORT:8762}

spring:
  config:
    import:
      - optional:classpath:modelcity-shared.yml
  application:
    name: model-city-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modelcity}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN}/

# Auth0 management (core vertical)
auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE} # Change this to your city name, this is an example
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
    db-connection: ${AUTH0_DB_CONNECTION}
    backoffice-role-id: ${AUTH0_BACKOFFICE_ROLE_ID}
    operator-role-id: ${AUTH0_OPERATOR_ROLE_ID}
    mobility-agent-role-id: ${AUTH0_MOBILITY_AGENT_ROLE_ID}

certificate:
  verification:
    dni-pepper: ${CERT_DNI_PEPPER}
    token-secret: ${CERT_TOKEN_SECRET}
    token-ttl-seconds: ${CERT_TOKEN_TTL_SECONDS:300}

# Mail, consumed by the shared core-domain code (same property structure as the core microservice).
mail:
  commons:
    city: ${MAIL_CITY_NAME} # Change this to your city name, this is an example
    address: ${MAIL_ADDRESS} # Change this to your city name, this is an example
  invitation:
    template:
      resource: ${INVITATION_MAIL_TEMPLATE_RESOURCE:templates/mail/invitation.html}
  otp:
    template:
      resource: ${OTP_MAIL_TEMPLATE_RESOURCE:templates/mail/otp.html}

# Stripe (leisure)
leisure:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    default-currency: eur

# Stripe (mobility — street reservations). secret-key feeds the shared mobility StripeConfig
# (same value as leisure: one Stripe account in the monolith); webhook-secret is the reservation webhook secret.
mobility:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_RESERVATION_WEBHOOK_SECRET}
    default-currency: eur

management:
  endpoints:
    web:
      exposure:
        include: health,info
