server:
  port: ${PORT:8091}

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  config:
    import:
      - optional:classpath:modelcity-shared.yml
      - optional:classpath:modelcity-eureka.yml
  application:
    name: engagement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modelcity-engagement}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true